name: Fetch V2Ray Configs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch VLESS configs from SG and TH sources
        run: |
          BASE="https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs"

          # ShatakVPN — Singapore and Thailand VLESS only
          curl -sf --max-time 30 "$BASE/sg/vless.txt" -o /tmp/shatak_sg.txt || true
          curl -sf --max-time 30 "$BASE/th/vless.txt" -o /tmp/shatak_th.txt || true

          # Epodonios — full pool, we filter SG/TH by keyword in test_servers.py
          curl -sf --max-time 30 "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o /tmp/epodonios_all.txt || true

          # MatinGhanbari — full pool, filter SG/TH by keyword in test_servers.py
          curl -sf --max-time 30 "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt" -o /tmp/matin_all.txt || true

      - name: Test and filter live servers
        run: python3 test_servers.py

      - name: Write stable placeholder
        run: echo "coming_soon" > configs/stable.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update configs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
