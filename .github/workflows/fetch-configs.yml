name: Fetch V2Ray Configs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch configs from providers
        run: |
          # Epodonios — large pool
          curl -sf --max-time 30 "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o /tmp/epodonios_all.txt || true

          # MatinGhanbari — large pool
          curl -sf --max-time 30 "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt" -o /tmp/matin_all.txt || true

          # F0rc3Run — mixed protocol, Telegram-sourced
          curl -sf --max-time 30 "https://raw.githubusercontent.com/F0rc3Run/F0rc3Run/main/Special/Telegram.txt" -o /tmp/f0rc3run_all.txt || true

          # RoosterKid / openproxylist — mixed protocol, hourly validated
          curl -sf --max-time 30 "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY.txt" -o /tmp/rooster_all.txt || true

      - name: Test and filter live servers per provider
        run: python3 test_servers.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update configs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
