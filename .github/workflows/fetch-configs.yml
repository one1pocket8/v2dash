name: Fetch V2Ray Configs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch configs from ShatakVPN
        run: |
          BASE="https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/sg"

          # For "Lowest Latency" tab — vless + vmess, TLS/443 prioritized, top 20
          curl -sf --max-time 30 "$BASE/vless.txt" -o /tmp/vless_raw.txt || true
          curl -sf --max-time 30 "$BASE/vmess.txt" -o /tmp/vmess_raw.txt || true
          cat /tmp/vless_raw.txt /tmp/vmess_raw.txt 2>/dev/null \
            | grep -v '^$' \
            | awk '!seen[$0]++' \
            | python3 -c "
import sys, re
lines = [l.strip() for l in sys.stdin if l.strip()]
def score(u):
    port_match = re.search(r':(\d+)[?#]', u)
    port = int(port_match.group(1)) if port_match else 9999
    tls = 1 if 'security=tls' in u or 'tls' in u else 0
    # Prefer TLS and common ports 443, 8443, 2083, 2087
    prio = 0 if port in (443,8443,2083,2087,2096) else 1
    return (prio, -tls, port)
lines.sort(key=score)
print('\n'.join(lines[:20]))
" > configs/latency.txt || echo "fetch failed" > configs/latency.txt

          # For "Top 20" tab — all protocols mixed, deduped
          curl -sf --max-time 30 "$BASE/all.txt" -o /tmp/all_raw.txt || true
          cat /tmp/all_raw.txt 2>/dev/null \
            | grep -v '^$' \
            | awk '!seen[$0]++' \
            | head -20 > configs/top20.txt || echo "fetch failed" > configs/top20.txt

          # "Best Stable" is coming soon — write placeholder
          echo "coming_soon" > configs/stable.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update configs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
