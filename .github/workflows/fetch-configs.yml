name: Fetch V2Ray Configs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch VLESS and VMess for Lowest Latency tab
        run: |
          curl -sf --max-time 30 "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/sg/vless.txt" -o /tmp/vless.txt || true
          curl -sf --max-time 30 "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/sg/vmess.txt" -o /tmp/vmess.txt || true
          cat /tmp/vless.txt /tmp/vmess.txt 2>/dev/null | grep -v '^$' | awk '!seen[$0]++' > /tmp/combined.txt
          python3 sort_latency.py
          cp /tmp/latency_sorted.txt configs/latency.txt

      - name: Fetch all protocols for Top 20 tab
        run: |
          curl -sf --max-time 30 "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/sg/all.txt" -o /tmp/all.txt || true
          cat /tmp/all.txt | grep -v '^$' | awk '!seen[$0]++' | head -20 > configs/top20.txt

      - name: Write stable placeholder
        run: echo "coming_soon" > configs/stable.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update configs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
