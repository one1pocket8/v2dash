<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V2Dash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

:root {
  --page-top: #f7f6f4;
  --page-bottom: #c3c3c1;
  --panel-tint: rgba(0,0,0,0.26);
  --card-bg: #0c0c0c;
  --pill-bg: #474747;
  --pill-ok: #3a7c52;
  --muted: #8f8d89;
  --dot-off: #bcbab6;
  --dot-on: #17140f;
  --ink: #171310;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  --serif: 'Instrument Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--page-bottom);
  color: var(--ink);
  font-family: var(--sans);
}

.app {
  max-width: 430px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, var(--page-top) 0%, var(--page-bottom) 380px, var(--page-bottom) 100%);
  overflow: hidden;
}

/* ── header ── */
.header-section { flex: 0 0 auto; padding: 44px 22px 0; }
.top-row { display: flex; justify-content: space-between; align-items: flex-start; }
.logo { font-family: var(--serif); font-size: 46px; font-weight: 400; letter-spacing: -1px; line-height: 1; color: var(--ink); }
.top-actions { display: flex; gap: 10px; margin-top: 2px; }

.icon-btn {
  width: 50px; height: 50px; border-radius: 15px;
  background: #111; border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .15s;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spinning svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn.ok { background: var(--pill-ok); }

.subtitle {
  text-align: center; font-family: var(--serif); font-style: italic;
  font-size: 18px; line-height: 1.35; color: #5c5854;
  margin: 20px 0 20px;
}

.dots { display: flex; justify-content: center; align-items: center; gap: 7px; margin-bottom: 22px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-off); transition: all .25s ease; }
.dot.active { width: 26px; border-radius: 5px; background: var(--dot-on); }

/* ── carousel ── */
.carousel-viewport { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 20px 22px; }
.carousel-track { display: flex; width: 400%; height: 100%; transition: transform .32s cubic-bezier(.22,.68,0,1); }
.carousel-track.dragging { transition: none; }
.tab-slide { flex: 0 0 25%; height: 100%; padding: 0 5px; }

.panel-card {
  background: var(--panel-tint);
  border-radius: 28px;
  padding: 20px 16px 16px 20px;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-head { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding-right: 4px; margin-bottom: 16px; }
.panel-head h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; color: rgba(255,255,255,.92); }
.copy-all-wrap { display: flex; align-items: center; gap: 10px; }
.copy-all-label { font-family: var(--serif); font-style: italic; font-size: 14px; color: rgba(255,255,255,.5); }
.icon-btn.small { width: 44px; height: 44px; border-radius: 13px; }
.icon-btn.small svg { width: 17px; height: 17px; }

.server-list {
  flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 10px; padding-right: 4px; padding-bottom: 4px;
  scrollbar-width: none;
}
.server-list::-webkit-scrollbar { display: none; }

.server-card { background: var(--card-bg); border-radius: 20px; padding: 15px 17px; flex: 0 0 auto; }
.row-top { display: flex; justify-content: space-between; align-items: baseline; }
.idx { font-family: var(--serif); font-size: 26px; color: #fff; }
.ping { font-size: 13.5px; color: #eae8e4; font-weight: 500; }
.row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
.vname { font-family: var(--serif); font-size: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.copy-btn {
  background: var(--pill-bg); color: #fff; border: none; border-radius: 100px;
  padding: 8px 19px; font-size: 12.5px; font-family: var(--sans); font-weight: 500;
  cursor: pointer; flex-shrink: 0; transition: background .15s, transform .1s;
}
.copy-btn:active { transform: scale(.95); }
.copy-btn.ok { background: var(--pill-ok); }

.state-msg { padding: 40px 6px; text-align: center; }
.state-msg .spinner { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
.state-msg p { color: rgba(255,255,255,.85); font-size: 14px; font-weight: 600; }
.state-msg small { color: rgba(255,255,255,.5); font-size: 12px; display: block; margin-top: 6px; line-height: 1.5; }

.foot-status { flex: 0 0 auto; text-align: center; font-size: 11px; color: rgba(0,0,0,.4); padding: 0 20px 14px; }
</style>
</head>
<body>

<div class="app">

  <div class="header-section">
    <div class="top-row">
      <div class="logo">V2Dash</div>
      <div class="top-actions">
        <button class="icon-btn" id="copyAllBtn" onclick="copyAll40()" aria-label="Copy all 40">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M9 16v2.5A2.5 2.5 0 0 0 11.5 21H18a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 18 9.5h-2"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" onclick="loadAll()" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
        </button>
      </div>
    </div>
    <p class="subtitle">Top vless servers<br>from opensource providers.</p>
    <div class="dots" id="dots">
      <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>

  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track">
      <div class="tab-slide" data-tab="epo">
        <div class="panel-card">
          <div class="panel-head">
            <h2>Epo</h2>
            <div class="copy-all-wrap">
              <span class="copy-all-label">copy all</span>
              <button class="icon-btn small" onclick="copyProvider('epo', this)" aria-label="Copy all Epo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M9 16v2.5A2.5 2.5 0 0 0 11.5 21H18a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 18 9.5h-2"/></svg>
              </button>
            </div>
          </div>
          <div class="server-list" id="list-epo"><div class="state-msg"><div class="spinner"></div><p>Loading…</p></div></div>
        </div>
      </div>
      <div class="tab-slide" data-tab="f0rc3run">
        <div class="panel-card">
          <div class="panel-head">
            <h2>Force3</h2>
            <div class="copy-all-wrap">
              <span class="copy-all-label">copy all</span>
              <button class="icon-btn small" onclick="copyProvider('f0rc3run', this)" aria-label="Copy all Force3">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M9 16v2.5A2.5 2.5 0 0 0 11.5 21H18a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 18 9.5h-2"/></svg>
              </button>
            </div>
          </div>
          <div class="server-list" id="list-f0rc3run"><div class="state-msg"><div class="spinner"></div><p>Loading…</p></div></div>
        </div>
      </div>
      <div class="tab-slide" data-tab="matin">
        <div class="panel-card">
          <div class="panel-head">
            <h2>Martin</h2>
            <div class="copy-all-wrap">
              <span class="copy-all-label">copy all</span>
              <button class="icon-btn small" onclick="copyProvider('matin', this)" aria-label="Copy all Martin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M9 16v2.5A2.5 2.5 0 0 0 11.5 21H18a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 18 9.5h-2"/></svg>
              </button>
            </div>
          </div>
          <div class="server-list" id="list-matin"><div class="state-msg"><div class="spinner"></div><p>Loading…</p></div></div>
        </div>
      </div>
      <div class="tab-slide" data-tab="rooster">
        <div class="panel-card">
          <div class="panel-head">
            <h2>Rooster</h2>
            <div class="copy-all-wrap">
              <span class="copy-all-label">copy all</span>
              <button class="icon-btn small" onclick="copyProvider('rooster', this)" aria-label="Copy all Rooster">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M9 16v2.5A2.5 2.5 0 0 0 11.5 21H18a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 18 9.5h-2"/></svg>
              </button>
            </div>
          </div>
          <div class="server-list" id="list-rooster"><div class="state-msg"><div class="spinner"></div><p>Loading…</p></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot-status" id="stxt">Loading…</div>
</div>

<script>
// Order matches the design: Epo, Force3, Martin, Rooster
const TABS = ['epo', 'f0rc3run', 'matin', 'rooster'];
const SRC = {
  epo:      './configs/epo.txt',
  f0rc3run: './configs/f0rc3run.txt',
  matin:    './configs/matin.txt',
  rooster:  './configs/rooster.txt'
};
window._c = {}; // { tab: [{ms, uri}, ...] }

function parse(raw) {
  // lines are "ms|uri"
  return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(line => {
    const i = line.indexOf('|');
    if (i === -1) return null;
    const ms = parseInt(line.slice(0,i), 10);
    const uri = line.slice(i+1);
    if (!Number.isFinite(ms) || !/^(vless|vmess|ss|trojan):\/\//.test(uri)) return null;
    return { ms, uri };
  }).filter(Boolean);
}

function displayName(uri) {
  try {
    if (uri.startsWith('vmess://')) {
      const j = JSON.parse(atob(uri.slice(8).split('#')[0]));
      return j.ps || j.add || 'vless name';
    }
    const ns = uri.replace(/^\w+:\/\//,'');
    const hp = ns.includes('@') ? ns.split('@').pop() : ns;
    const host = hp.split(/[/?#:]/)[0];
    const rn = uri.split('#')[1] || '';
    let name = ''; try { name = decodeURIComponent(rn); } catch { name = rn; }
    name = name.replace(/[^\x20-\x7E]/g,'').trim();
    return name || host || 'vless name';
  } catch { return 'vless name'; }
}

function renderPanel(tab, entries) {
  const el = document.getElementById('list-'+tab);
  if (!entries || !entries.length) {
    el.innerHTML = `<div class="state-msg"><p>No configs yet</p><small>Run the "Fetch V2Ray Configs" GitHub Action, or hit refresh once it has.</small></div>`;
    return;
  }
  window._c[tab] = entries;
  el.innerHTML = entries.map((e,i) => {
    const s = t => (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="server-card">
      <div class="row-top">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="ping">ping ${e.ms}</span>
      </div>
      <div class="row-bottom">
        <span class="vname" title="${s(displayName(e.uri))}">${s(displayName(e.uri))}</span>
        <button class="copy-btn" onclick="cp(this,'${tab}',${i})">copy</button>
      </div>
    </div>`;
  }).join('');
}

function copyText(text, onDone) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(onDone).catch(()=>fallbackCopy(text,onDone));
  } else fallbackCopy(text,onDone);
}
function fallbackCopy(t, cb) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); cb(); } catch(_){}
  document.body.removeChild(ta);
}

function cp(btn, tab, idx) {
  const uri = window._c[tab][idx].uri;
  copyText(uri, () => {
    btn.textContent = '✓'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('ok'); }, 1800);
  });
}

function copyProvider(tab, btn) {
  const entries = window._c[tab];
  if (!entries || !entries.length) return;
  copyText(entries.map(e=>e.uri).join('\n'), () => flashIcon(btn));
}

function copyAll40() {
  const all = TABS.flatMap(t => (window._c[t]||[]).map(e=>e.uri));
  if (!all.length) return;
  copyText(all.join('\n'), () => flashIcon(document.getElementById('copyAllBtn')));
}

function flashIcon(btn) {
  btn.classList.add('ok');
  setTimeout(()=>btn.classList.remove('ok'), 1500);
}

async function loadAll() {
  const rbtn = document.getElementById('refreshBtn');
  rbtn.classList.add('spinning');
  document.getElementById('stxt').textContent = 'Refreshing…';

  let total = 0;
  await Promise.all(TABS.map(async tab => {
    try {
      const res = await fetch(`${SRC[tab]}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      if (!raw.trim() || raw.trim() === 'fetch failed') throw new Error('No data yet — run the GitHub Action');
      const entries = parse(raw);
      renderPanel(tab, entries);
      total += entries.length;
    } catch (e) {
      document.getElementById('list-'+tab).innerHTML = `<div class="state-msg"><p>Could not load</p><small>${e.message}</small></div>`;
    }
  }));

  rbtn.classList.remove('spinning');
  const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById('stxt').textContent = total ? `${total} servers · updated ${t}` : `Updated ${t}`;
}

loadAll();

// ── swipe carousel (pointer events cover touch + mouse) ──
const track = document.getElementById('track');
const viewport = document.getElementById('viewport');
const dots = [...document.querySelectorAll('.dot')];
let activeIndex = 0;
let startX = 0, startY = 0, dragX = 0, lockedAxis = null, dragging = false;

function setActive(i, animate = true) {
  activeIndex = Math.max(0, Math.min(TABS.length - 1, i));
  track.classList.toggle('dragging', !animate);
  track.style.transform = `translateX(-${activeIndex * 25}%)`;
  dots.forEach((d, idx) => d.classList.toggle('active', idx === activeIndex));
}

function onDown(e) {
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX; startY = p.clientY; dragX = 0; lockedAxis = null; dragging = false;
}
function onMove(e) {
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - startX, dy = p.clientY - startY;
  if (lockedAxis === null) {
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (lockedAxis === 'x') {
    if (e.cancelable) e.preventDefault();
    dragging = true;
    dragX = dx;
    const viewW = viewport.clientWidth || 1;
    const pct = (dragX / viewW) * 25;
    track.classList.add('dragging');
    track.style.transform = `translateX(calc(-${activeIndex * 25}% + ${pct}%))`;
  }
}
function onUp() {
  if (dragging) {
    const viewW = viewport.clientWidth || 1;
    const threshold = viewW * 0.16;
    if (dragX <= -threshold) setActive(activeIndex + 1);
    else if (dragX >= threshold) setActive(activeIndex - 1);
    else setActive(activeIndex);
  }
  lockedAxis = null; dragging = false; dragX = 0;
}

viewport.addEventListener('touchstart', onDown, { passive: true });
viewport.addEventListener('touchmove', onMove, { passive: false });
viewport.addEventListener('touchend', onUp);
viewport.addEventListener('touchcancel', onUp);
viewport.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', (e) => { if (lockedAxis !== null || e.buttons === 1) onMove(e); });
window.addEventListener('mouseup', onUp);

setActive(0, false);
</script>
</body>
</html>
