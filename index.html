<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V2Ray</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --bg: #0e0e0e;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --orange: #ff4d1c;
  --orange-dark: #cc3a12;
  --blue: #2f54eb;
  --off-white: #f0f0f0;
  --muted: #666666;
  --success: #22c55e;
  --radius: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #0e0e0e; }

body {
  background: var(--bg);
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  padding-bottom: 48px;
}

.header {
  padding: 56px 24px 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.header h1 { font-size: 40px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
.header p  { font-size: 13px; color: var(--muted); margin-top: 5px; }

.refresh-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface2); border: none;
  color: var(--muted); font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0; margin-top: 2px;
}
.refresh-btn:hover { color: #fff; }
.refresh-btn.spinning { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.status-row {
  display: flex; align-items: center; gap: 8px;
  padding: 0 24px 22px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.status-text { font-size: 13px; color: var(--muted); }
.status-text b { color: var(--off-white); font-weight: 500; }

/* stat cards */
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 24px 10px; }
.stat-card { border-radius: var(--radius); padding: 22px 20px; position: relative; overflow: hidden; }
.stat-card.orange { background: var(--orange); }
.stat-card.blue   { background: var(--blue); }
.stat-card .num   { font-size: 44px; font-weight: 700; letter-spacing: -2.5px; line-height: 1; }
.stat-card .lbl   { font-size: 11px; font-weight: 600; opacity: .7; margin-top: 5px; text-transform: uppercase; letter-spacing: .8px; }
.stat-card .ico   { position: absolute; bottom: 14px; right: 18px; font-size: 24px; opacity: .3; }

/* sub link */
.sub-card {
  background: var(--blue); border-radius: var(--radius);
  padding: 20px 22px; margin: 10px 24px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.sub-card h3 { font-size: 15px; font-weight: 700; }
.sub-card p  { font-size: 12px; opacity: .65; margin-top: 2px; }
.sub-btn {
  background: rgba(255,255,255,.18); border: none; border-radius: 12px;
  color: #fff; font-family: 'Space Grotesk', sans-serif;
  font-size: 12px; font-weight: 700; padding: 9px 16px;
  cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0;
}
.sub-btn:hover { background: rgba(255,255,255,.28); }
.sub-btn.copied { background: rgba(34,197,94,.35); }

/* section */
.section-header { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 24px 14px; }
.section-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.section-header span { font-size: 12px; color: var(--muted); }

/* pills */
.pills { display: flex; gap: 8px; padding: 0 24px 20px; overflow-x: auto; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  padding: 9px 20px; border-radius: 100px; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; border: none; transition: all .2s;
}
.pill.off  { background: var(--surface2); color: var(--muted); }
.pill.on-vless { background: var(--orange); color: #fff; }
.pill.on-vmess { background: var(--blue);   color: #fff; }
.pill.on-ss    { background: #3a3a3a;        color: #fff; }

/* panels */
.panels { padding: 0 24px; }
.panel { display: none; flex-direction: column; gap: 10px; }
.panel.active { display: flex; }

/* cards */
.config-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px 18px; display: flex; align-items: center; gap: 14px;
  transition: background .15s;
}
.config-card:active { background: var(--surface2); }
.rank { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 20px; }
.info { flex: 1; min-width: 0; }
.cname { font-size: 14px; font-weight: 600; color: var(--off-white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .4px; text-transform: uppercase; }
.t-port  { background: rgba(255,255,255,.06); color: #777; }
.t-tls   { background: rgba(34,197,94,.15);  color: #4ade80; }
.t-notls { background: rgba(255,77,28,.12);  color: #ff6b47; }
.t-type  { background: rgba(47,84,235,.2);   color: #818cf8; }
.btns { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.btn-c, .btn-q {
  border: none; border-radius: 10px; font-size: 12px; font-weight: 600;
  font-family: 'Space Grotesk', sans-serif; cursor: pointer; padding: 7px 13px;
  transition: all .15s; white-space: nowrap;
}
.btn-c { background: var(--surface2); color: var(--off-white); }
.btn-c:active { transform: scale(.95); }
.btn-c.ok { background: rgba(34,197,94,.2); color: #4ade80; }
.btn-q { background: var(--orange); color: #fff; }
.btn-q:active { transform: scale(.95); background: var(--orange-dark); }

/* states */
.loading-s, .error-s { padding: 48px 0; text-align: center; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
.loading-s p { color: var(--muted); font-size: 14px; }
.error-s p { color: #f87171; font-size: 14px; font-weight: 600; }
.error-s small { color: var(--muted); font-size: 12px; display: block; margin-top: 6px; line-height: 1.5; }

/* modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; align-items: flex-end; justify-content: center; backdrop-filter: blur(6px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 28px 28px 0 0; padding: 24px 28px 48px; width: 100%; max-width: 430px; text-align: center; animation: up .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes up { from { transform: translateY(100%); } }
.handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 22px; }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.modal p  { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
#qr-box { display: inline-block; background: #fff; padding: 16px; border-radius: 16px; margin-bottom: 22px; }
.modal-close { width: 100%; padding: 14px; background: var(--surface2); border: none; border-radius: 14px; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }

.footer { text-align: center; padding: 32px 24px 0; font-size: 12px; color: #444; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>V2Ray</h1>
    <p>Myanmar · Best servers</p>
  </div>
  <button class="refresh-btn" id="rbtn" onclick="loadAll()">↻</button>
</div>

<div class="status-row">
  <div class="dot"></div>
  <div class="status-text" id="stxt">Loading configs…</div>
</div>

<div class="stat-row">
  <div class="stat-card orange">
    <div class="num" id="stat-n">—</div>
    <div class="lbl">Servers</div>
    <div class="ico">⚡</div>
  </div>
  <div class="stat-card blue">
    <div class="num">3</div>
    <div class="lbl">Protocols</div>
    <div class="ico">🔗</div>
  </div>
</div>

<div class="sub-card">
  <div>
    <h3>Subscription Link</h3>
    <p>Import all at once into V2BOX</p>
  </div>
  <button class="sub-btn" id="subbtn" onclick="copySubLink()">Copy link</button>
</div>

<div class="section-header">
  <h2>Servers</h2>
  <span>Top 10 each</span>
</div>

<div class="pills">
  <button class="pill on-vless" data-p="vless" onclick="switchTab('vless',this)">VLESS</button>
  <button class="pill off"      data-p="vmess" onclick="switchTab('vmess',this)">VMess</button>
  <button class="pill off"      data-p="ss"    onclick="switchTab('ss',this)">Shadowsocks</button>
</div>

<div class="panels">
  <div class="panel active" id="panel-vless"><div class="loading-s"><div class="spinner"></div><p>Loading…</p></div></div>
  <div class="panel"        id="panel-vmess"><div class="loading-s"><div class="spinner"></div><p>Loading…</p></div></div>
  <div class="panel"        id="panel-ss">   <div class="loading-s"><div class="spinner"></div><p>Loading…</p></div></div>
</div>

<div class="footer">Auto-fetched every 4h · V2RayRoot/V2RayConfig</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="handle"></div>
    <h3>Scan with V2BOX</h3>
    <p>Point your camera to import this server</p>
    <div id="qr-box"></div>
    <button class="modal-close" onclick="closeModal()">Done</button>
  </div>
</div>

<script>
const SRC = { vless:'./configs/vless.txt', vmess:'./configs/vmess.txt', ss:'./configs/ss.txt' };
window._c = {};

function parse(raw, proto) {
  const pfx = proto==='ss' ? 'ss://' : proto+'://';
  return raw.split('\n').map(l=>l.trim()).filter(l=>l.startsWith(pfx)).slice(0,10);
}

function meta(uri) {
  try {
    if (uri.startsWith('vmess://')) {
      const j = JSON.parse(atob(uri.slice(8).split('#')[0]));
      return { name: j.ps||j.add||'VMess', port: j.port||'?', tls: j.tls==='tls', type: j.net||'tcp' };
    }
    const ns = uri.replace(/^\w+:\/\//,'');
    const parts = ns.split('@');
    const hp = parts.length>1 ? parts[parts.length-1] : parts[0];
    const ci = hp.lastIndexOf(':');
    const host = hp.slice(0,ci)||hp;
    const port = hp.slice(ci+1).split(/[/?#]/)[0]||'?';
    const qi = hp.indexOf('?');
    const p = new URLSearchParams(qi>=0 ? hp.slice(qi+1).split('#')[0] : '');
    const tls = (p.get('security')||'').includes('tls');
    const type = p.get('type')||p.get('net')||'tcp';
    const rn = uri.split('#')[1]||'';
    let name=''; try { name=decodeURIComponent(rn); } catch { name=rn; }
    name = name.replace(/[^\x20-\x7E]/g,'').trim()||host;
    return { name, port, tls, type };
  } catch { return { name: uri.slice(0,28), port:'?', tls:false, type:'?' }; }
}

function renderPanel(proto, configs) {
  const el = document.getElementById('panel-'+proto);
  if (!configs||!configs.length) {
    el.innerHTML = `<div class="error-s"><p>No configs yet</p><small>Go to Actions → "Fetch V2Ray Configs" → Run workflow</small></div>`;
    return;
  }
  window._c[proto] = configs;
  el.innerHTML = configs.map((uri,i) => {
    const m = meta(uri);
    const s = t=>(t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="config-card">
      <div class="rank">${String(i+1).padStart(2,'0')}</div>
      <div class="info">
        <div class="cname" title="${s(m.name)}">${s(m.name)}</div>
        <div class="tags">
          <span class="tag t-port">:${m.port}</span>
          <span class="tag ${m.tls?'t-tls':'t-notls'}">${m.tls?'TLS':'NO TLS'}</span>
          <span class="tag t-type">${(m.type||'tcp').toUpperCase()}</span>
        </div>
      </div>
      <div class="btns">
        <button class="btn-c" onclick="cp(this,'${proto}',${i})">Copy</button>
        <button class="btn-q" onclick="qr('${proto}',${i})">QR</button>
      </div>
    </div>`;
  }).join('');
}

function cp(btn, proto, idx) {
  const uri = window._c[proto][idx];
  const done = () => { btn.textContent='✓'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('ok'); },2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(uri).then(done).catch(()=>fb(uri,done));
  else fb(uri,done);
}

function fb(t, cb) {
  const ta = document.createElement('textarea');
  ta.value=t; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); cb(); } catch(_){}
  document.body.removeChild(ta);
}

function copySubLink() {
  const all = [...(window._c.vless||[]),...(window._c.vmess||[]),...(window._c.ss||[])];
  if (!all.length) { alert('Wait for configs to finish loading.'); return; }
  const url = 'data:text/plain;base64,' + btoa(unescape(encodeURIComponent(all.join('\n'))));
  const btn = document.getElementById('subbtn');
  const done = () => { btn.textContent='✓ Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='Copy link'; btn.classList.remove('copied'); },2500); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(()=>fb(url,done));
  else fb(url,done);
}

function qr(proto, idx) {
  const uri = window._c[proto][idx];
  const box = document.getElementById('qr-box');
  box.innerHTML = '';
  new QRCode(box, { text:uri, width:220, height:220, colorDark:'#000', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.M });
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function switchTab(proto, el) {
  document.querySelectorAll('.pill').forEach(p => { p.className='pill off'; });
  el.className = `pill on-${proto}`;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+proto).classList.add('active');
}

async function loadAll() {
  const btn = document.getElementById('rbtn');
  btn.classList.add('spinning');
  document.getElementById('stxt').innerHTML = 'Refreshing…';
  window._c = {};
  ['vless','vmess','ss'].forEach(p => {
    document.getElementById('panel-'+p).innerHTML = `<div class="loading-s"><div class="spinner"></div><p>Loading…</p></div>`;
  });

  let total = 0;
  await Promise.all(['vless','vmess','ss'].map(async proto => {
    try {
      const res = await fetch(`${SRC[proto]}?t=${Date.now()}`, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      if (!raw.trim()||raw.trim()==='fetch failed') throw new Error('Run the GitHub Action first');
      const configs = parse(raw, proto);
      renderPanel(proto, configs);
      total += configs.length;
    } catch(e) {
      document.getElementById('panel-'+proto).innerHTML = `<div class="error-s"><p>${proto.toUpperCase()} failed</p><small>${e.message}</small></div>`;
    }
  }));

  document.getElementById('stat-n').textContent = total||'—';
  const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  document.getElementById('stxt').innerHTML = `Updated <b>${t}</b> · 4h auto-refresh`;
  btn.classList.remove('spinning');
}

loadAll();
</script>
</body>
</html>
